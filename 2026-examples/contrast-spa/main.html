<!doctype html>

  This is the scaffold color contrast example we'll use throughout week 3. This is

  for project 3!

<html lang="en">
    <head>
        <title>cooler colours</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
        <script src="main.js"></script>
    </head>
    <body id="app">
        <header class="navbar">
            <h1>cooler colours</h1>
            <nav class="nav-links">
                <ul>
                    <li><a href="main.html">Calculator</a></li>
                    <li>Game (coming soon)</li>
                    <li>History / Data (coming soon)</li>
                </ul>
            </nav>
        </header>
        <main class="prose">
            <section>
                <h2>Your Colo(u)rs Here!</h2>
                <p>
                    Calculates the
                    <a href="https://www.w3.org/TR/WCAG21/#dfn-contrast-ratio"
                        >WCAG 2.1 contrast ratio</a
                    >
                    between two colors.
                </p>
                <div id="color-inputs">
                    <div class="form-group">
                        <label for="color1">colour 1:</label>
                        <input type="color" id="color1" value="#8ACE00">
                    </div>
                    <div class="form-group">
                        <label for="color2">colour 2:</label>
                        <input type="color" id="color2" value="#000000">
                    </div>
                </div>
                <button class="block-button" id="calculate">calculate contrast</button>
            </section>
            <div id="report"></div>
        </main>
        <hr>
        <footer class="prose">
            <p>by <a href="https://mattx.wang">matt</a></p>
        </footer>
    </body>
</html>
