<!doctype html>
<html lang="en">
    <head>
        <title>color contrast game | cooler colours</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
        <script src="shared.js"></script>
        <script src="game.js"></script>
    </head>
    <body id="app">
        <div>
            <header class="navbar">
                <h1>cooler colours</h1>
                <nav class="nav-links">
                    <ul>
                        <li><a href="index.html">Home / Calculator</a></li>
                        <li><a href="game.html">Game</a></li>
                        <li><a href="data.html">History / Data</a></li>
                    </ul>
                </nav>
            </header>
            <main class="prose">
                <section>
                    <h2>game</h2>
                    <p>
                        does this color combination have "good" colour contrast (WCAG 2.1 contrast
                        >= 4.5)?
                    </p>
                    <div class="grid-2-md">
                        <p id="sample-text"></p>
                        <div id="game-controls">
                            <div id="info-box">
                                <button class="block-button game-button" id="yes-btn">
                                    good contrast
                                </button>
                                <button class="block-button game-button" id="no-btn">
                                    bad contrast
                                </button>
                            </div>
                            <div id="result-box"></div>
                            <button class="block-button game-button" id="next-btn">
                                next color
                            </button>
                        </div>
                    </div>
                </section>
                <section>
                    <h2>stats</h2>
                    <dl class="stats">
                        <dt>correct</dt>
                        <dd id="num-correct">loading...</dd>
                        <dt>incorrect</dt>
                        <dd id="num-wrong">loading...</dd>
                        <dt>win %</dt>
                        <dd id="win-pct">loading...</dd>
                    </dl>
                </section>
            </main>
            <hr>
            <footer class="prose">
                <p>by <a href="https://mattx.wang">matt</a></p>
            </footer>
        </div>
    </body>
</html>
