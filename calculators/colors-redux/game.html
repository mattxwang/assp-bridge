<!doctype html>
<html lang="en">
    <head>
        <title>color contrast game | cooler colours</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
        <script src="shared.js"></script>
        <script src="game.js"></script>
    </head>
    <body>
        <div>
            <header class="navbar">
                <h1>cooler colours</h1>
                <nav class="nav-links">
                    <ul>
                        <li><a href="index.html">Home / Calculator</a></li>
                        <li><a href="history.html">Past Colors</a></li>
                        <li><a href="game.html">Game</a></li>
                    </ul>
                </nav>
            </header>
            <main class="prose">
                <section>
                    <h2>game</h2>
                    <p>
                        does this color combination have "good" colour contrast (WCAG 2.1 AA contrast >= 4.5)?
                    </p>
                    <p id="sample-text">

                    </p>
                    <div id="game-controls">
                        <button id="yes-btn">yes</button>
                        <button id="no-btn">no</button>
                        <button id="next-btn">next color</button>
                    </div>
                </section>
                <section>
                    <h2>stats</h2>
                    <dl>
                        <dt>correct</dt>
                        <dd>0</dd>
                        <dt>incorrect</dt>
                        <dd>0</dd>
                        <dt>win %</dt>
                        <dd>n/a</dd>
                    </dl>
                    <button id="clear-history-button">clear history</button>
                </section>
            </main>
            <hr>
            <footer class="prose">
                <p>by <a href="https://mattx.wang">matt</a></p>
            </footer>
        </div>
    </body>
</html>
