<!doctype html>
<html lang="en">
    <head>
        <title>cooler colours</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
        <script src="shared.js"></script>
        <script src="index.js"></script>
    </head>
    <body id="app">
        <div>
            <header class="navbar">
                <h1>cooler colours</h1>
                <nav class="nav-links">
                    <ul>
                        <li><a href="index.html">Home / Calculator</a></li>
                        <li><a href="game.html">Game</a></li>
                        <li><a href="data.html">History / Data</a></li>
                    </ul>
                </nav>
            </header>
            <main class="prose grid-2-md">
                <section>
                    <h2>Your Colo(u)rs Here!</h2>
                    <p>
                        Calculates the
                        <a href="https://www.w3.org/TR/WCAG21/#dfn-contrast-ratio"
                            >WCAG 2.1 contrast ratio</a
                        >
                        between two colors.
                    </p>
                    <form id="calculator">
                        <div id="color-inputs">
                            <div class="form-group">
                                <label for="color1">colour 1:</label>
                                <input type="color" id="color1" value="#8ACE00">
                            </div>
                            <div class="form-group">
                                <label for="color2">colour 2:</label>
                                <input type="color" id="color2" value="#000000">
                            </div>
                        </div>
                        <button class="block-button" type="submit">calculate contrast</button>
                        <button class="block-button" id="swap">swap colours</button>
                    </form>
                </section>
                <div id="report"></div>
            </main>
            <hr>
            <footer class="prose">
                <p>by <a href="https://mattx.wang">matt</a></p>
            </footer>
        </div>
    </body>
</html>
